name: Build Official DANA Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install PWA CLI & Generate Native Android Shell
        run: |
          npm install -g @bubblewrap/cli
          echo -e "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n" | bubblewrap init --manifest="https://mellifluous-hummingbird-8ca65e.netlify.app/manifest.json" || true
          cd app || true

      - name: Build Android Release APK with Gradle
        run: |
          if [ -d "app" ]; then cd app; fi
          chmod +x ./gradlew || true
          ./gradlew assembleRelease || ./gradlew assembleDebug || true

      - name: Upload Built APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Official-Agent-DANA-APK
          path: |
            **/*.apk
            !**/build_twa/**
