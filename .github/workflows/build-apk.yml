name: Build Official DANA Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build TWA APK (Automated)
        run: |
          mkdir -p build_twa && cd build_twa
          bubblewrap init --manifest=https://mellifluous-hummingbird-8ca65e.netlify.app/manifest.json --directory=. --skipPwaValidation
          bubblewrap build --skipSigning || bubblewrap build
          ls -la

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Official-Agent-DANA-APK
          path: |
            build_twa/*.apk
            build_twa/app/*.apk
            build_twa/app/build/outputs/apk/**/*.apk
